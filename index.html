<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Archive</title>
    <style>
        :root { --bg-color: #fcfbf9; --card-bg: #ffffff; --text-color: #1a1a1a; --accent-color: #767167; --border-color: #eee; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 3rem 1rem; margin: 0; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 2rem; }
        
        /* Header & Logo */
        header { text-align: center; }
        .logo-img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 1rem; object-fit: cover; border: 1px solid var(--border-color); }
        h1 { font-size: 1.4rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
        
        /* Cards & Links */
        .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 2rem; border-radius: 12px; }
        .card h2 { font-size: 0.9rem; text-transform: uppercase; margin-bottom: 1rem; letter-spacing: 0.05em; border-left: 2px solid #000; padding-left: 10px; }
        .links { display: flex; flex-direction: column; gap: 0.8rem; }
        .link-item { padding: 0.8rem; background: var(--bg-color); border-radius: 6px; text-decoration: none; color: var(--text-color); font-size: 0.9rem; border: 1px solid var(--border-color); }
        
        /* Form */
        .form-group { display: flex; flex-direction: column; gap: 0.8rem; }
        input, textarea { width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit; }
        button { background: #000; color: #fff; padding: 1rem; border: none; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 6px; margin-top: 0.5rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="logo.jpg" alt="Logo" class="logo-img">
            <h1>Minimalist Archive</h1>
        </header>

        <div class="card">
            <h2>The Collection</h2>
            <div class="links">
                <a href="#" class="link-item">Digital Storefront ↗</a>
                <a href="#" class="link-item">Premium Templates ↗</a>
                <a href="#" class="link-item">Latest Notion Setup ↗</a>
            </div>
        </div>

        <div class="card">
            <h2>Project Status</h2>
            <p style="font-size: 0.85rem; color: var(--accent-color);">Entry 02 // Developing a silent luxury PR hub.</p>
        </div>

        <div class="card" id="connect">
            <h2>PR & Collaborations</h2>
            <form action="https://api.web3forms.com/submit" method="POST" class="form-group">
                <input type="hidden" name="access_key" value="46a7d902-ad54-46a7-8ab6-7d162dc2b868">
                <input type="text" name="name" placeholder="Brand Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <textarea name="message" rows="4" placeholder="Campaign details..." required></textarea>
                <button type="submit">SEND PROPOSAL</button>
            </form>
        </div>
    </div>

</body>
</html>
