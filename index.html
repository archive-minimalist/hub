<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Archive</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fcfbf9; color: #1a1a1a; display: flex; justify-content: center; padding: 4rem 1rem; margin: 0; }
        .container { width: 100%; max-width: 500px; text-align: center; }
        .logo-img { width: 120px; height: 120px; border-radius: 50%; margin-bottom: 1.5rem; object-fit: cover; }
        h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 2rem; }
        .card { background: #ffffff; border: 1px solid #eee; padding: 2rem; border-radius: 12px; text-align: left; }
        .form-group { display: flex; flex-direction: column; gap: 1rem; }
        input, textarea { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        button { background: #000; color: #fff; padding: 1rem; border: none; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 6px; margin-top: 0.5rem; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.jpg" alt="Logo" class="logo-img">
        <h1>Minimalist Archive</h1>
        
        <div class="card">
            <form action="https://api.web3forms.com/submit" method="POST" class="form-group">
                <input type="hidden" name="access_key" value="46a7d902-ad54-46a7-8ab6-7d162dc2b868">
                
                <input type="text" name="name" placeholder="Brand Name" required>
                <input type="email" name="email" placeholder="Contact Email" required>
                <textarea name="message" rows="4" placeholder="Outline your campaign details..." required></textarea>
                
                <button type="submit">SEND PROPOSAL</button>
            </form>
        </div>
    </div>

</body>
</html>
